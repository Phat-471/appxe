name: SpeedAlert Android CD - Tested Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.2.3)'
        required: true
        default: 'v1.2.3'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Bản Cập Nhật SpeedAlert VN'

permissions:
  contents: write

jobs:
  # GIAI ĐOẠN 1: BẮT BUỘC KIỂM THỬ TOÀN DIỆN (QUALITY GATE)
  test-gate:
    name: Mandatory Quality Gate & Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Automated Unit Tests (Speed-Adaptive Warning, Battery, Rollback...)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  # GIAI ĐOẠN 2: ĐÓNG GÓI APK VÀ PHÁT HÀNH BẢN CẬP NHẬT (CHỈ CHẠY KHI ĐÃ VƯỢT QUA TEST)
  build-and-publish:
    name: Build APK & Publish Tested Release
    needs: [test-gate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Determine Release Tag & Title
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
            echo "TITLE=${{ github.event.inputs.release_title }}" >> $GITHUB_OUTPUT
          else
            TAG=${GITHUB_REF#refs/tags/}
            echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT
            echo "TITLE=SpeedAlert VN $TAG (Official Stable Release)" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.TAG_NAME }}
          name: ${{ steps.release_meta.outputs.TITLE }}
          body_path: version.json
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
